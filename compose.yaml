name: taskflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${TASKFLOW_SQL_PASSWORD:?Set TASKFLOW_SQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TASKFLOW_SQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" > /dev/null
      interval: 10s
      timeout: 8s
      start_period: 45s
      retries: 12

volumes:
  sqlserver-data:
