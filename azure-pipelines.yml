trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: '10.0.x'

  - task: UseNode@1
    displayName: Install Node.js 24
    inputs:
      version: '24.x'

  - bash: |
      set -euo pipefail
      npm ci --no-audit --no-fund
      npm run build
      npm test -- --watch=false
    workingDirectory: frontend
    displayName: Build and test Angular
    env:
      NG_CLI_ANALYTICS: 'false'

  - bash: |
      set -euo pipefail
      export COMPOSE_PROJECT_NAME="taskflow-ci-$(Build.BuildId)"
      export TASKFLOW_SQL_PASSWORD="Ci_$(openssl rand -hex 24)!"
      trap 'docker compose down --volumes' EXIT
      docker compose up -d --wait --wait-timeout 180 sqlserver
      node --test scripts/integration.test.cjs
    displayName: Build API and test with SQL Server and SignalR
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
